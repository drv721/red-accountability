<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#001B45">
<title>R.E.D.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy:       #002D72;
  --navy-deep:  #001B45;
  --white:      #ffffff;
  --peri:       #BAC8F2;
  --red:        #D32F2F;
  --red-bright: #FF4A3D;
  --ink:        #20345c;
  --muted:      #5f6b85;
  --mark-off:   rgba(0,45,114,.26);
  --nav-h:      80px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  overflow: hidden; height: 100%;
  background: var(--navy-deep);
  font-family: Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ── layout ── */
#first-run {
  position: fixed; inset: 0;
  background: var(--navy-deep);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px;
}
#app {
  position: fixed;
  top: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  display: none;
}
.tab {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
}
.tab.active { display: flex; }
.tab-head { flex-shrink: 0; padding: 62px 22px 12px; }
.tab-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 22px 28px; }

/* ── wordmark ── */
.wordmark { font-weight: 700; font-size: 18px; letter-spacing: .22em; color: var(--white); }
.wordmark span { color: var(--red-bright); }
.datestamp {
  font-size: 12px; font-weight: 500; letter-spacing: .03em;
  color: rgba(255,255,255,.72); margin-top: 7px;
}

/* ── nudge bubbles ── */
.nudges { margin: 18px 0 2px; display: flex; flex-direction: column; gap: 8px; }
.nudge {
  display: flex; align-items: center; gap: 11px;
  padding: 13px 15px; border-radius: 13px;
  background: var(--peri); border: 1px solid rgba(0,45,114,.16);
  animation: settle .3s cubic-bezier(.32,.72,0,1);
}
.nudge-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--red); flex-shrink: 0;
  box-shadow: 0 0 0 4px rgba(211,47,47,.20);
}
.nudge-text { font-size: 14px; font-weight: 400; color: var(--ink); line-height: 1.35; flex: 1; }
.nudge-text b { font-weight: 600; color: var(--navy); }
.nudge-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--muted); flex-shrink: 0;
}

/* ── person cards ── */
.card {
  background: var(--white); border-radius: 20px;
  padding: 21px 21px 19px; margin-top: 13px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.card.own { cursor: default; }
.card-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 3px; }
.name { font-weight: 600; font-size: 38px; line-height: 1; color: var(--navy); letter-spacing: -.025em; }
.streak { text-align: right; flex-shrink: 0; }
.streak-num { font-weight: 700; font-size: 25px; color: var(--red); line-height: 1; letter-spacing: -.02em; }
.streak-lbl {
  font-size: 12px; font-weight: 600; letter-spacing: .03em;
  color: var(--muted); margin-top: 5px;
}
.goal { font-size: 12.5px; font-weight: 300; color: var(--muted); margin-bottom: 19px; }

/* ── nine marks ── */
.marks { display: flex; align-items: flex-end; gap: 16px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.bars { display: flex; gap: 5px; }
.bar {
  width: 7px; height: 22px; border-radius: 3px;
  border: 1.5px solid var(--mark-off); background: transparent;
  transition: background .15s ease, border-color .15s ease;
}
.bar.on { background: var(--red); border-color: var(--red); }
.glbl {
  font-size: 12px; font-weight: 600; letter-spacing: .03em; color: var(--muted);
}
.score {
  margin-left: auto; font-family: 'JetBrains Mono', monospace;
  font-size: 12px; color: var(--muted); align-self: flex-end; padding-bottom: 2px;
}
.score b { color: var(--navy); font-weight: 500; }

/* ── food card ── */
.food {
  margin-top: 20px; padding: 16px 19px; border-radius: 15px;
  border: 1px dashed rgba(255,255,255,.26);
}
.food-lbl {
  font-size: 12px; font-weight: 600; letter-spacing: .03em;
  color: rgba(255,255,255,.72); margin-bottom: 8px;
}
.food-item { font-size: 17px; font-weight: 300; color: rgba(255,255,255,.94); }

/* ── bottom nav ── */
#nav {
  position: fixed; bottom: 0;
  left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: rgba(0,15,40,.97); border-top: 1px solid rgba(255,255,255,.11);
  display: none; align-items: stretch;
}
.nav-btn {
  flex: 1; cursor: pointer; background: none; border: none;
  display: flex; flex-direction: column; align-items: center;
  padding-top: 14px;
  font-family: Inter, system-ui, sans-serif; font-size: 12px;
  font-weight: 600; letter-spacing: .04em;
  color: rgba(255,255,255,.62);
  -webkit-tap-highlight-color: transparent;
}
.nav-btn.active { color: var(--red-bright); }
.nav-tick { display: block; width: 16px; height: 2px; margin: 0 auto 9px; background: transparent; border-radius: 2px; }
.nav-btn.active .nav-tick { background: var(--red-bright); }

/* ── log tab ── */
.log-section-head {
  font-size: 12px; font-weight: 600; letter-spacing: .03em;
  color: rgba(255,255,255,.72); margin: 24px 0 12px;
}
.log-section-head:first-child { margin-top: 16px; }
.log-card {
  background: rgba(255,255,255,.06); border-radius: 20px;
  padding: 20px; margin-bottom: 4px;
}

/* water */
.water-btn {
  width: 100%; padding: 26px;
  border-radius: 18px; background: rgba(255,255,255,.07);
  border: 1.5px solid rgba(255,255,255,.14);
  color: var(--white); font-size: 20px; font-weight: 600;
  font-family: inherit; cursor: pointer; letter-spacing: -.01em;
  -webkit-tap-highlight-color: transparent;
  transition: background .1s;
}
.water-btn:active { background: rgba(255,255,255,.14); }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip {
  padding: 8px 18px; border-radius: 100px; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid rgba(255,255,255,.18);
  background: transparent; color: rgba(255,255,255,.65);
  font-size: 14px; font-family: inherit; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all .12s;
}
.chip.sel { background: var(--red-bright); border-color: var(--red-bright); color: #fff; }

/* activity chips — wider for labels */
.chips.activity .chip { padding: 8px 14px; }

/* log button */
.log-btn {
  width: 100%; padding: 18px; border-radius: 14px;
  background: var(--red-bright); border: none;
  color: #fff; font-size: 17px; font-weight: 600;
  font-family: inherit; cursor: pointer; margin-top: 16px;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .1s;
}
.log-btn:active { opacity: .85; }
.log-btn:disabled { opacity: .4; cursor: default; }

/* time inputs */
.time-row { display: flex; gap: 12px; }
.time-field { flex: 1; }
.time-label { font-size: 12px; font-weight: 600; letter-spacing: .03em; color: rgba(255,255,255,.72); margin-bottom: 6px; }
input[type="time"] {
  width: 100%; padding: 12px 14px; border-radius: 12px;
  background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.14);
  color: #fff; font-size: 16px; font-family: 'JetBrains Mono', monospace;
  outline: none; -webkit-appearance: none;
}
.hours-display {
  text-align: center; font-size: 13px; color: rgba(255,255,255,.65);
  margin: 10px 0 2px;
}

/* mood grid */
.mood-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mood-chip {
  padding: 14px 10px; border-radius: 12px;
  border: 1.5px solid rgba(255,255,255,.16);
  background: transparent; color: rgba(255,255,255,.75);
  font-size: 14px; font-family: inherit; cursor: pointer; text-align: center;
  -webkit-tap-highlight-color: transparent; transition: all .12s;
}
.mood-chip.sel { background: var(--navy); border-color: var(--navy); color: #fff; }
textarea.mood-note {
  width: 100%; padding: 12px 14px; border-radius: 12px; margin-top: 10px;
  background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.14);
  color: #fff; font-size: 16px; font-family: inherit;
  resize: none; outline: none; min-height: 72px;
}
textarea.mood-note::placeholder { color: rgba(255,255,255,.3); }

/* weight */
.weight-row { display: flex; align-items: center; gap: 10px; }
input.weight-in {
  flex: 1; padding: 14px; border-radius: 12px;
  background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.14);
  color: #fff; font-size: 24px; font-family: 'JetBrains Mono', monospace;
  text-align: center; outline: none; -webkit-appearance: none;
}
.weight-unit { color: rgba(255,255,255,.65); font-size: 16px; }

/* ── first run ── */
.fr-wordmark { font-weight: 700; font-size: 24px; letter-spacing: .22em; color: var(--white); margin-bottom: 10px; }
.fr-wordmark span { color: var(--red-bright); }
.fr-sub { font-size: 14px; font-weight: 300; color: rgba(255,255,255,.72); margin-bottom: 32px; text-align: center; }
.fr-body { font-size: 15px; font-weight: 300; color: rgba(255,255,255,.72); text-align: center; line-height: 1.6; margin-bottom: 36px; max-width: 300px; }
.fr-step { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 340px; }
.fr-cards { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.fr-card {
  background: var(--white); border-radius: 20px; padding: 28px 24px;
  font-weight: 600; font-size: 38px; letter-spacing: -.025em; color: var(--navy);
  border: none; text-align: left; cursor: pointer; font-family: inherit;
  -webkit-tap-highlight-color: transparent; transition: transform .1s;
}
.fr-card:active { transform: scale(.97); }
.fr-confirm-rows {
  width: 100%; background: rgba(255,255,255,.06); border-radius: 16px;
  overflow: hidden; margin-bottom: 28px;
}
.fr-confirm-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 15px 18px; border-bottom: 1px solid rgba(255,255,255,.07);
}
.fr-confirm-row:last-child { border-bottom: none; }
.fr-confirm-lbl { font-size: 14px; color: rgba(255,255,255,.6); }
.fr-confirm-val { font-size: 14px; font-weight: 600; color: var(--white); }
.fr-install-rows { width: 100%; display: flex; flex-direction: column; gap: 18px; margin-bottom: 36px; }
.fr-install-row { display: flex; align-items: flex-start; gap: 16px; }
.fr-install-icon {
  width: 44px; height: 44px; min-width: 44px; border-radius: 12px;
  background: rgba(255,255,255,.1); display: flex; align-items: center;
  justify-content: center; font-size: 20px;
}
.fr-install-label { font-size: 15px; color: rgba(255,255,255,.85); line-height: 1.4; padding-top: 10px; }
.fr-install-label small { display: block; color: rgba(255,255,255,.5); font-size: 12px; margin-top: 3px; }
.fr-skip {
  background: none; border: none; padding: 16px 24px; margin-top: 4px;
  color: rgba(255,255,255,.45); font-size: 14px; font-family: inherit;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.fr-full-btn { width: 100%; }

/* ── nudge sheet ── */
#nudge-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 50; display: none; opacity: 0;
  transition: opacity .2s;
}
#nudge-overlay.open { display: block; opacity: 1; }
#nudge-sheet {
  position: fixed; bottom: 0;
  left: 50%; transform: translateX(-50%) translateY(100%);
  width: 100%; max-width: 480px;
  background: var(--navy); border-radius: 24px 24px 0 0;
  padding: 24px 20px calc(40px + env(safe-area-inset-bottom, 0px)); z-index: 51;
  transition: transform .28s cubic-bezier(.32,.72,0,1);
}
#nudge-overlay.open #nudge-sheet { transform: translateX(-50%) translateY(0); }
.sheet-title {
  font-size: 12px; font-weight: 600; letter-spacing: .03em;
  color: rgba(255,255,255,.72); text-align: center; margin-bottom: 20px;
}
.nudge-opt {
  width: 100%; padding: 16px 18px; margin-bottom: 10px;
  border-radius: 14px; background: rgba(255,255,255,.08);
  border: 1.5px solid rgba(255,255,255,.12);
  color: var(--white); font-size: 16px; font-family: inherit;
  cursor: pointer; text-align: left;
  -webkit-tap-highlight-color: transparent; transition: background .1s;
}
.nudge-opt:active { background: rgba(255,255,255,.16); }
.sheet-cancel {
  width: 100%; padding: 16px; margin-top: 4px;
  border-radius: 14px; background: transparent;
  border: 1.5px solid rgba(255,255,255,.12);
  color: rgba(255,255,255,.65); font-size: 16px; font-family: inherit; cursor: pointer;
}

/* ── me tab ── */
.me-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,.08);
}
.me-label { font-size: 14px; color: rgba(255,255,255,.72); }
.me-value { font-size: 14px; color: var(--white); font-weight: 500; }
.me-section-head {
  font-size: 12px; font-weight: 600; letter-spacing: .03em;
  color: rgba(255,255,255,.72); margin: 28px 0 4px;
}

/* ── flash ── */
.flash {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(0,45,114,.95); color: #fff; padding: 12px 24px;
  border-radius: 100px; font-size: 14px; font-weight: 500;
  z-index: 200; white-space: nowrap; pointer-events: none;
  animation: fadeout 1.8s forwards .3s;
}
@keyframes fadeout { to { opacity: 0; transform: translate(-50%, -6px); } }
@keyframes settle {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── loading state ── */
.loading { color: rgba(255,255,255,.6); font-size: 14px; padding: 40px 0; text-align: center; }

/* ── progress tab ── */
.user-switcher { display: flex; gap: 8px; margin: 16px 0 20px; }
.switcher-btn {
  flex: 1; padding: 10px 6px; border-radius: 10px; min-height: 44px;
  border: 1.5px solid rgba(255,255,255,.14);
  background: transparent; color: rgba(255,255,255,.72);
  font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: all .12s;
}
.switcher-btn.active {
  background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.3);
  color: var(--white);
}

.progress-stats { display: flex; gap: 12px; margin-bottom: 24px; }
.pstat {
  flex: 1; background: rgba(255,255,255,.05); border-radius: 14px; padding: 16px 14px;
}
.pstat-num {
  display: block; font-weight: 700; font-size: 28px; color: var(--red-bright);
  letter-spacing: -.02em; line-height: 1;
}
.pstat-lbl {
  display: block; font-size: 12px; font-weight: 600; letter-spacing: .03em;
  color: rgba(255,255,255,.72); margin-top: 6px;
}

.chart-section { margin-bottom: 28px; }
.chart-head {
  display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;
}
.chart-title {
  font-size: 12px; font-weight: 600; letter-spacing: .03em; color: rgba(255,255,255,.72);
}
.chart-sub { font-size: 12px; color: rgba(255,255,255,.55); }
.chart-wrap {
  background: rgba(255,255,255,.04); border-radius: 12px; padding: 12px 10px 8px;
  overflow: hidden;
}
.chart-empty { color: rgba(255,255,255,.6); font-size: 13px; text-align: center; padding: 28px 0; }

.history-section { margin-top: 28px; }
.h-entry { padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
.h-ts {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: rgba(255,255,255,.6); letter-spacing: .06em; margin-bottom: 3px;
}
.h-detail { font-size: 14px; color: rgba(255,255,255,.78); }

@media (prefers-reduced-motion: reduce) {
  .bar, .nudge-opt, .chip, .mood-chip { transition: none; }
  #nudge-sheet, #nudge-overlay { transition: none; }
  .nudge { animation: none; }
  .flash { animation: none; opacity: 1; }
}
</style>
</head>
<body>

<!-- ── First run ── -->
<div id="first-run">

  <!-- Step 1: Name -->
  <div id="fr-name" class="fr-step">
    <div class="fr-wordmark">R<span>.</span>E<span>.</span>D<span>.</span></div>
    <p class="fr-sub">Who are you?</p>
    <div class="fr-cards">
      <button class="fr-card" onclick="frPickName('ray')">Ray</button>
      <button class="fr-card" onclick="frPickName('evan')">Evan</button>
      <button class="fr-card" onclick="frPickName('daniel')">Daniel</button>
    </div>
  </div>

  <!-- Step 2: Confirm setup -->
  <div id="fr-confirm" class="fr-step">
    <div class="fr-wordmark">R<span>.</span>E<span>.</span>D<span>.</span></div>
    <p class="fr-sub">Your setup</p>
    <div class="fr-confirm-rows" id="fr-confirm-rows"></div>
    <button class="log-btn fr-full-btn" onclick="frAfterConfirm()">Looks good →</button>
  </div>

  <!-- Step 3: Install gate -->
  <div id="fr-install" class="fr-step">
    <div class="fr-wordmark">R<span>.</span>E<span>.</span>D<span>.</span></div>
    <p class="fr-sub">Add to your home screen</p>
    <div class="fr-install-rows" id="fr-install-rows"></div>
    <p style="font-size:13px;color:rgba(255,255,255,.45);text-align:center;line-height:1.5">
      Open R.E.D. from your home screen to continue.
    </p>
  </div>

  <!-- Step 4: Notifications -->
  <div id="fr-notify" class="fr-step">
    <div class="fr-wordmark">R<span>.</span>E<span>.</span>D<span>.</span></div>
    <p class="fr-sub">Stay on track</p>
    <p class="fr-body">R.E.D. will remind you to check in 6 times a day — and ping you when the crew sends a nudge.</p>
    <button class="log-btn fr-full-btn" onclick="frRequestNotify()">Allow notifications →</button>
    <button class="fr-skip" onclick="frFinish()">Skip for now</button>
  </div>

</div>

<!-- ── App ── -->
<div id="app">

  <!-- Crew -->
  <div id="tab-crew" class="tab active">
    <div class="tab-head">
      <div class="wordmark">R<span>.</span>E<span>.</span>D<span>.</span></div>
      <div id="datestamp" class="datestamp"></div>
    </div>
    <div id="crew-body" class="tab-body"><div class="loading">Loading…</div></div>
  </div>

  <!-- Log -->
  <div id="tab-log" class="tab">
    <div class="tab-head">
      <div class="wordmark">R<span>.</span>E<span>.</span>D<span>.</span></div>
      <div class="datestamp">Log</div>
    </div>
    <div id="log-body" class="tab-body"></div>
  </div>

  <!-- Progress -->
  <div id="tab-progress" class="tab">
    <div class="tab-head">
      <div class="wordmark">R<span>.</span>E<span>.</span>D<span>.</span></div>
      <div class="datestamp">Progress</div>
    </div>
    <div id="progress-body" class="tab-body"></div>
  </div>

  <!-- Me -->
  <div id="tab-me" class="tab">
    <div class="tab-head">
      <div class="wordmark">R<span>.</span>E<span>.</span>D<span>.</span></div>
      <div class="datestamp">Me</div>
    </div>
    <div id="me-body" class="tab-body"></div>
  </div>

</div>

<!-- ── Bottom nav ── -->
<nav id="nav">
  <button class="nav-btn active" onclick="setTab('crew')"><span class="nav-tick"></span>Crew</button>
  <button class="nav-btn"        onclick="setTab('log')"><span class="nav-tick"></span>Log</button>
  <button class="nav-btn"        onclick="setTab('progress')"><span class="nav-tick"></span>Progress</button>
  <button class="nav-btn"        onclick="setTab('me')"><span class="nav-tick"></span>Me</button>
</nav>

<!-- ── Nudge sheet ── -->
<div id="nudge-overlay" onclick="if(event.target===this)closeNudgeSheet()">
  <div id="nudge-sheet">
    <div id="sheet-title" class="sheet-title"></div>
    <div id="sheet-opts"></div>
    <button class="sheet-cancel" onclick="closeNudgeSheet()">Cancel</button>
  </div>
</div>

<script>
'use strict';

// ── config ────────────────────────────────────────────────────────────────────
const API_BASE = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  ? 'http://localhost:8787'
  : 'https://red-api.builtbyvega.com';

const VAPID_PUBLIC_KEY = 'BHxwL2kPQvRj73DTlByH3nKhuFP5O4zIrB7Ylq8QcWOLLOj3EfUZXKcHHWjLZkakAgUav6DDd_1N8MPgTjVn4tg';

// ── food library ──────────────────────────────────────────────────────────────
const FOOD = [
  'Apple with peanut butter','Banana with peanut butter','Hard-boiled eggs',
  'String cheese','Unsalted almonds','Unsalted peanuts',

// ── date / time helpers ───────────────────────────────────────────────────────
function getTz() {
  return userTz || Intl.DateTimeFormat().resolvedOptions().timeZone;
}

function localDate(tz) {
  return new Date().toLocaleDateString('en-CA', { timeZone: tz });
}

function localTime(tz) {
  return new Date().toLocaleTimeString('en-US', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false,
  }).replace(/^24:/, '00:');
}

function formatDatestamp(tz) {
  const now = new Date();
  const DAYS   = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  // Parse local time components via locale string
  const loc = new Date(now.toLocaleString('en-US', { timeZone: tz }));
  const h = loc.getHours(), m = loc.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12  = h % 12 || 12;
  const tzAbbr = now.toLocaleTimeString('en-US', { timeZone: tz, timeZoneName: 'short' }).split(' ').slice(-1)[0];
  return `${DAYS[loc.getDay()]} · ${MONTHS[loc.getMonth()]} ${loc.getDate()} · ${h12}:${String(m).padStart(2,'0')} ${ampm} ${tzAbbr}`;
}

function isSunday(tz) {
  const loc = new Date(new Date().toLocaleString('en-US', { timeZone: tz }));
  return loc.getDay() === 0;
}

function todayFood() {
  const days = Math.floor((Date.now() - new Date('2024-01-01').getTime()) / 86400000);
  return FOOD[days % FOOD.length];
}

function formatNudgeTime(tsUtc) {
  const now = new Date(), ts = new Date(tsUtc);
  const diffH = (now - ts) / 3600000;
  if (diffH < 1) return 'just now';
  const loc = new Date(ts.toLocaleString('en-US', { timeZone: getTz() }));
  const h = loc.getHours(), m = loc.getMinutes();
  const ampm = h >= 12 ? 'p' : 'a';
  const h12  = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,'0')}${ampm}`;
}

function sleepHours(bedAt, wakeAt) {
  if (!bedAt || !wakeAt) return null;
  const [bh, bm] = bedAt.split(':').map(Number);
  const [wh, wm] = wakeAt.split(':').map(Number);
  let mins = (wh * 60 + wm) - (bh * 60 + bm);
  if (mins <= 0) mins += 1440;
  return +(mins / 60).toFixed(1);
}

async function postCheckin(payload) {
  const res = await fetch(`${API_BASE}/api/checkin`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  return res.json();
}

async function postNudge(to, kind) {
  const res = await fetch(`${API_BASE}/api/nudge`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: userId, to, kind }),

  return res.json();

  return {
    user_id: userId, type,
    ts_utc:     new Date().toISOString(),
    local_date: localDate(tz),
    local_time: localTime(tz),
    tz,
    ...extras,
  };
}

// ── html escaping ─────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// SVG viewBox: 320 × H, all charts scale to container width via width="100%"
function lineChart(data, { goalY } = {}) {
  if (!data.length) return '<div class="chart-empty">No data yet</div>';

  const W = 320, H = 90;
  const P = { t: 12, r: 6, b: 8, l: 6 };
  const pw = W - P.l - P.r, ph = H - P.t - P.b;

  const ys = data.map(d => d.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (goalY != null) { lo = Math.min(lo, goalY); hi = Math.max(hi, goalY); }
  const range = hi - lo || 1;
  lo -= range * 0.08; hi += range * 0.08;

  // With 1 point, center it horizontally; otherwise spread across full width.
  const sx = i  => data.length === 1 ? P.l + pw / 2 : P.l + (i / (data.length - 1)) * pw;
  const sy = v  => P.t + ph - ((v - lo) / (hi - lo)) * ph;
  const fx = n  => n.toFixed(1);

  const pts  = data.map((d,i) => `${fx(sx(i))},${fx(sy(d.y))}`).join(' ');
  const dots = data.map((d,i) =>
    `<circle cx="${fx(sx(i))}" cy="${fx(sy(d.y))}" r="2.5" fill="var(--red-bright)"/>`
  ).join('');

  const goalLine = goalY != null ? `<line x1="${P.l}" y1="${fx(sy(goalY))}"
    x2="${P.l+pw}" y2="${fx(sy(goalY))}"
    stroke="rgba(255,255,255,.3)" stroke-width="1" stroke-dasharray="3,3"/>` : '';

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible">
    ${goalLine}
    <polyline fill="none" stroke="var(--red-bright)" stroke-width="1.8"
      stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>
    ${dots}
  </svg>`;
}

function barChart(data, { maxY, greenAt } = {}) {
  if (!data.length) return '<div class="chart-empty">No data yet</div>';

  const W = 320, H = 72;
  const P = { t: 6, r: 4, b: 4, l: 4 };
  const pw = W - P.l - P.r, ph = H - P.t - P.b;

  const cap  = maxY ?? Math.max(...data.map(d => d.y), 1);
  const slot = pw / data.length;
  const gap  = Math.max(slot * 0.2, 1);
  const bw   = Math.max(slot - gap, 1);

  const baseline = P.t + ph;
  const bars = data.map((d, i) => {
    const x  = P.l + i * slot + gap / 2;
    const wx = bw.toFixed(1);
    if (d.y === 0) {
      // 2px tick at the baseline — missed day reads as a mark, not empty space
      return `<rect x="${x.toFixed(1)}" y="${(baseline - 2).toFixed(1)}"
        width="${wx}" height="2" rx="1"
        fill="var(--red-bright)" fill-opacity="0.35"/>`;
    }
    const frac    = Math.min(d.y / cap, 1);
    const bh      = frac * ph;
    const y       = baseline - bh;
    const isGreen = greenAt != null ? d.y >= greenAt : true;
    const op      = isGreen ? 0.9 : 0.5;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}"
      width="${wx}" height="${bh.toFixed(1)}" rx="1.5"
      fill="var(--red-bright)" fill-opacity="${op}"/>`;
  }).join('');

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block">
    ${bars}
  </svg>`;
}

function chartSection(title, sub, inner) {
  return `<div class="chart-section">
    <div class="chart-head">
      <span class="chart-title">${title}</span>
      <span class="chart-sub">${sub}</span>
    </div>
    <div class="chart-wrap">${inner}</div>
  </div>`;
}

function renderHistoryLog(rows, tz) {
  if (!rows.length) return '';
  const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun',
                  'Jul','Aug','Sep','Oct','Nov','Dec'];

  const entries = rows.map(r => {
    const [yr, mo, dy] = r.local_date.split('-').map(Number);
    const dow = DAYS[new Date(Date.UTC(yr, mo-1, dy)).getUTCDay()];
    const ts  = `${dow} · ${MONTHS[mo-1]} ${dy} · ${r.local_time}`;

    let detail;
    switch (r.type) {
      case 'water':  detail = `Water · ${r.qty || 16} oz`; break;
      case 'move':   detail = `Move · ${esc(r.activity)}${r.duration_min ? ' · ' + r.duration_min + ' min' : ''}`; break;
      case 'sleep':  detail = `Sleep · ${r.hours != null ? r.hours + ' hrs' : ''}${r.bed_at ? ' · bed ' + esc(r.bed_at) + (r.wake_at ? ' / up ' + esc(r.wake_at) : '') : ''}`; break;
      case 'mood':   detail = `Mood · ${esc(r.mood)}${r.note ? ' — ' + esc(r.note) : ''}`; break;
      case 'weight': detail = `Weight · ${r.qty} lbs`; break;
      default:       detail = esc(r.type);
    }
    return `<div class="h-entry"><div class="h-ts">${ts}</div><div class="h-detail">${detail}</div></div>`;
  }).join('');

  return `<div class="history-section">
    <div class="chart-title" style="margin-bottom:12px">Log</div>
    ${entries}
  </div>`;
}

  if (logDuration === 'custom') {
    durMins = parseInt(document.getElementById('dur-custom')?.value);
    if (!durMins) { flash('Enter duration'); return; }
  }
  const payload = buildCheckin('move', { activity: logActivity, duration_min: durMins });
  await postCheckin(payload);
  flash(`${logActivity} logged`);
  logActivity = null;
  logDuration = null;
  await loadFeed();
  renderLog();
}

async function submitSleep() {
  const bedAt  = document.getElementById('log-bed')?.value;
  const wakeAt = document.getElementById('log-wake')?.value;
  if (!bedAt || !wakeAt) { flash('Set bed and wake times'); return; }
  const hrs = sleepHours(bedAt, wakeAt);
  const payload = buildCheckin('sleep', { bed_at: bedAt, wake_at: wakeAt, hours: hrs });
  await postCheckin(payload);
  flash('Sleep logged');
  await loadFeed();
}

async function submitMood() {
  const note = document.getElementById('mood-note')?.value.trim();
  const mood = logMood || (note ? 'Something else' : null);
  if (!mood) { flash('Pick a mood'); return; }
  const payload = buildCheckin('mood', { mood, note: note || null });
  await postCheckin(payload);
  flash('Mood logged');
  logMood = null;
  await loadFeed();
  renderLog();
}

async function submitWeight() {
  const val = parseFloat(document.getElementById('log-weight-val')?.value);
  if (!val || val < 50 || val > 500) { flash('Enter a valid weight'); return; }
  const payload = buildCheckin('weight', { qty: val });
  await postCheckin(payload);
  flash('Weight logged');
  await loadFeed();  // weight_logged_today now comes from D1 via feed
  renderLog();
}

// ── nudge sheet ───────────────────────────────────────────────────────────────
function openNudgeSheet(targetId) {
  if (targetId === userId) return;
  nudgeTarget = targetId;
  const targetUser = feedData?.users?.find(u => u.id === targetId);
  document.getElementById('sheet-title').textContent = `Send to ${targetUser?.name || targetId}`;

  const opts = Object.entries(NUDGE_LABELS).map(([kind, label]) =>
    `<button class="nudge-opt" onclick="sendNudge('${kind}')">${label}</button>`
  ).join('');
  document.getElementById('sheet-opts').innerHTML = opts;

  const overlay = document.getElementById('nudge-overlay');
  overlay.style.display = 'block';
  // Force reflow so transition fires
  overlay.offsetHeight;
  overlay.classList.add('open');
}

function closeNudgeSheet() {
  const overlay = document.getElementById('nudge-overlay');
  overlay.classList.remove('open');
  setTimeout(() => { overlay.style.display = 'none'; nudgeTarget = null; }, 280);
}

async function sendNudge(kind) {
  if (!nudgeTarget) return;
  closeNudgeSheet();
  try {
    await postNudge(nudgeTarget, kind);
    const targetUser = feedData?.users?.find(u => u.id === nudgeTarget);
    flash(`Sent to ${targetUser?.name || nudgeTarget}`);
  } catch {
    flash('Could not send — check connection');
  }
}

// ── nav ───────────────────────────────────────────────────────────────────────
function setTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${name}`)?.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach((b, i) => {
    const tabs = ['crew','log','progress','me'];
    b.classList.toggle('active', tabs[i] === name);
  });
  if (name === 'progress' && !historyData) {
    loadHistory(progressUser || userId);
  }
}

// ── push notifications ────────────────────────────────────────────────────────
function urlB64ToUint8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function registerSW() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    return await navigator.serviceWorker.register('/sw.js');
  } catch { return null; }
}

async function subscribePush(uid) {
  if (!('PushManager' in window) || !('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;

    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlB64ToUint8(VAPID_PUBLIC_KEY),
      });
    }

    // Store userId in cache so SW can fetch /api/feed on push
    const cache = await caches.open('red-state');
    await cache.put('/sw-user', new Response(uid));

    await fetch(`${API_BASE}/api/subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: uid, subscription: sub.toJSON() }),
    });
  } catch (e) {
    console.warn('Push subscription failed:', e);
  }
}

async function requestPushPermission(uid) {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    await subscribePush(uid);
  } else if (Notification.permission === 'default') {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') await subscribePush(uid);
  }
}

// ── first run ─────────────────────────────────────────────────────────────────
let frPendingId = null;

const FR_SETUP = {
  ray:    { tz: 'Eastern',  bed: '10:30 PM', wake: '6:00 AM', hours: '7.5h' },
  evan:   { tz: 'Eastern',  bed: '11:00 PM', wake: '7:00 AM', hours: '8h'   },
  daniel: { tz: 'Central',  bed: '10:30 PM', wake: '6:30 AM', hours: '7h'   },
};

function frShow(step) {
  document.querySelectorAll('.fr-step').forEach(s => s.style.display = 'none');
  const el = document.getElementById(`fr-${step}`);
  if (el) el.style.display = 'flex';
  document.getElementById('first-run').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('nav').style.display = 'none';
}

function isStandalone() {
  return window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
}

function frPickName(id) {
  frPendingId = id;
  // Persist now so install gate → reopen still knows who this is
  localStorage.setItem('red_user_id', id);
  userId = id;

  const cfg = FR_SETUP[id] || {};
  document.getElementById('fr-confirm-rows').innerHTML = [
    ['Timezone',    cfg.tz],
    ['Bed target',  cfg.bed],
    ['Wake target', cfg.wake],
    ['Sleep goal',  cfg.hours],
  ].map(([l, v]) => `
    <div class="fr-confirm-row">
      <span class="fr-confirm-lbl">${l}</span>
      <span class="fr-confirm-val">${v}</span>
    </div>`).join('');

  frShow('confirm');
}

function frAfterConfirm() {
  if (isStandalone()) {
    frShow('notify');
  } else {
    frBuildInstall();
    frShow('install');
  }
}

function frBuildInstall() {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const rows = ios ? [
    { icon: '⬆', text: 'Tap the Share button', sub: 'at the bottom of Safari' },
    { icon: '＋', text: 'Tap "Add to Home Screen"', sub: '' },
  ] : [
    { icon: '⋮', text: 'Open browser menu', sub: 'top-right corner' },
    { icon: '＋', text: 'Tap "Add to Home Screen" or "Install App"', sub: '' },
  ];
  document.getElementById('fr-install-rows').innerHTML = rows.map(r => `
    <div class="fr-install-row">
      <div class="fr-install-icon">${r.icon}</div>
      <div class="fr-install-label">${r.text}${r.sub ? `<small>${r.sub}</small>` : ''}</div>
    </div>`).join('');
}

async function frRequestNotify() {
  if ('Notification' in window && Notification.permission !== 'denied') {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      await registerSW();
      await subscribePush(frPendingId || userId).catch(() => {});
    }
  }
  frFinish();
}

function frFinish() {
  userId = frPendingId || userId;
  localStorage.setItem('red_user_id', userId);
  localStorage.setItem('red_onboarded', '1');
  showApp();
}

function switchUser() {
  localStorage.removeItem('red_user_id');
  localStorage.removeItem('red_tz');
  localStorage.removeItem('red_onboarded');
  userId = null; userTz = null; feedData = null; meData = null;
  historyData = null; progressUser = null; frPendingId = null;
  frShow('name');
}

// ── flash ─────────────────────────────────────────────────────────────────────
function flash(msg) {
  const el = document.createElement('div');
  el.className = 'flash';
  el.textContent = msg;
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

// ── init ──────────────────────────────────────────────────────────────────────
function showApp() {
  progressUser = userId;
  document.getElementById('first-run').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  setTab('crew');
  renderDatestamp();
  Promise.all([loadFeed(), loadMe()]);
  setInterval(renderDatestamp, 60000);
  // Keep SW + subscription current on every launch
  registerSW().then(() => subscribePush(userId).catch(() => {}));
}

(function init() {
  const onboarded = localStorage.getItem('red_onboarded');
  if (onboarded && userId) {
    showApp();
    return;
  }
  // Partially through onboarding
  if (userId) {
    frPendingId = userId;
    if (isStandalone()) {
      // Installed — go straight to notification step
      if (Notification.permission === 'granted') {
        // Already granted (e.g. prior install) — subscribe silently and launch
        localStorage.setItem('red_onboarded', '1');
        registerSW().then(() => subscribePush(userId).catch(() => {}));
        showApp();
      } else {
        frShow('notify');
      }
    } else {
      // Not installed yet — show install gate
      frBuildInstall();
      frShow('install');
    }
    return;
  }
  // Fresh first run
  frShow('name');
})();
</script>
